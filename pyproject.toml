[project]
name = "ipyd3geo"
version = "0.1.0"
description = "An interactive map widget for Jupyter that uses D3 Geo as its renderer."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Benjamin Szeghy", email = "benjamin.szeghy@berkeley.edu" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "anywidget>=0.11.0",
]

[project.urls]
Repository = "https://github.com/geojupyter/prototype-ipyd3geo"
Issues = "https://github.com/geojupyter/prototype-ipyd3geo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/ipyd3geo",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.7",
]

[tool.uv.dependency-groups]
docs = { requires-python = ">=3.12" }
