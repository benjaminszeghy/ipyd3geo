[project]
name = "ipyd3geo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { name = "Benjamin Szeghy", email = "benjamin.szeghy@berkeley.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.21.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.7",
]
